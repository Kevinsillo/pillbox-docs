<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" shape-rendering="geometricPrecision">
  <title>Pillbox</title>
  <style>
    :root { --c: #141414; }
    @media (prefers-color-scheme: dark) {
      :root { --c: #FAFAF7; }
    }
  </style>
  <defs>
    <clipPath id="cap"><rect x="22" y="18" width="20" height="28" rx="10"></rect></clipPath>
  </defs>
  <path d="M16 14 L8 14 L8 50 L16 50" fill="none" stroke="var(--c)" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"></path>
  <path d="M48 14 L56 14 L56 50 L48 50" fill="none" stroke="var(--c)" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"></path>
  <g clip-path="url(#cap)">
